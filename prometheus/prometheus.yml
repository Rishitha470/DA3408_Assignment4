# Prometheus config for DA3408 A4 (image captioning observability)
#
# 5s scrape interval so the dashboard looks live at a 5s refresh rate.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Prometheus watching itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # System metrics (CPU / RAM / disk / network) from node_exporter.
  # node_exporter runs as a container in docker-compose.yml. If you installed it
  # directly on your machine instead, change the target to
  # "host.docker.internal:9100".
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: my-laptop

  # The Streamlit app. It runs on the host (not in Docker) and exposes /metrics
  # on port 8000, so Prometheus reaches it through host.docker.internal
  # (mapped to the host in docker-compose.yml for Linux).
  - job_name: captioning_app
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          app: image-captioning
