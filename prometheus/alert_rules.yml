# Alert rules for the captioning app.
#
# AI usage note (course code of conduct): the PromQL expressions and the regex in
# this file were generated by Claude (Anthropic) inside one larger request. The
# prompt was the assignment brief itself plus a request to build the whole
# submission. The part that produced these rules, in short form, was:
#   "Alerting rules for a CPU-bound image captioning app: app down, p95 latency,
#    error ratio, app memory, host CPU, host memory, disk usage."
# That line is a summary of the intent, not the verbatim prompt. Full details are in
# AI_DISCLOSURE.md and the logic of each expression is explained in docs/PROMQL_NOTES.md.

groups:
  - name: captioning-app
    rules:
      - alert: CaptioningAppDown
        expr: up{job="captioning_app"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Captioning app is not reachable"
          description: "Prometheus could not scrape {{ $labels.instance }} for 30 seconds."

      - alert: HighInferenceLatencyP95
        # p95 of per-image model time over the last 2 minutes
        expr: histogram_quantile(0.95, sum by (le) (rate(captioning_inference_seconds_bucket[2m]))) > 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "p95 inference time above 10 s"
          description: "95% of images are taking longer than {{ $value | humanizeDuration }}."

      - alert: HighErrorRatio
        # failed images / all images over 5 minutes, only when there was traffic
        expr: |
          sum(rate(captioning_images_processed_total{status="error"}[5m]))
            / sum(rate(captioning_images_processed_total[5m])) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "More than 10% of images are failing"
          description: "Error ratio is {{ $value | humanizePercentage }}."

      - alert: AppMemoryHigh
        expr: captioning_process_resident_memory_bytes > 3e9
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Captioning process is using more than 3 GB"
          description: "Resident memory is {{ $value | humanize1024 }}B."

  - name: host
    rules:
      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "node_exporter is not reachable"

      - alert: HostCpuSaturated
        expr: 100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[1m]))) > 90
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU above 90% for a minute"
          description: "CPU busy: {{ $value | printf \"%.0f\" }}%."

      - alert: HostMemoryHigh
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Host memory above 90%"

      - alert: HostDiskAlmostFull
        # fstype regex generated by Claude (see header): keeps only real disks by
        # leaving out virtual filesystems.
        expr: |
          100 * (1 - node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay|squashfs"}
                     / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay|squashfs"}) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Root filesystem is more than 85% full"
